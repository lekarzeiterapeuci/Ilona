# Publikacja czatu na GitHub Pages (adres: https://lekarzeiterapeuci.github.io/Ilona/).
# Uruchamia się przy każdym pushu na main. Przed publikacją sprawdza wersję i testy —
# jeśli coś nie przechodzi, strona zostaje w poprzedniej (działającej) wersji.
name: Publikacja na GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz; trwającego nie przerywamy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kontrola wersji
        run: node tools/check-version.js
      - name: Testy
        run: node --no-warnings tools/test.js
      # Na stronie potrzebny jest tylko czat (embed.js, chat/, settings.json), strona testowa
      # i podgląd panelu (na publicznym adresie działa wyłącznie w trybie demo — prawdziwy
      # panel uruchamia się lokalnie: npm run panel). Kod serwera panelu i narzędzia nie są publikowane.
      - name: Usuń części niepubliczne
        run: rm -rf panel/server panel/backups tools docs .github
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
